# Produktivbetrieb (Phase 3, Abschnitt 4): eine Installation pro Branche.
#
# Standard: Traefik (läuft schon auf dem Server, Netz "edge") leitet HTTPS an
# die App weiter. Die Datenbank und die Sicherung hängen NUR im internen Netz
# und haben keinen Port nach außen.
#
# Alternative für einen Server OHNE Traefik: Profil "caddy" (siehe README).
#
# Alle Namen (Projekt, Traefik-Router, Volumes) hängen an INSTALLATION aus
# der .env. So können auf einem Server mehrere Installationen nebeneinander
# laufen, ohne sich gegenseitig zu überschreiben.

name: ${INSTALLATION:?In der .env fehlt INSTALLATION, z. B. INSTALLATION=eb}-prod

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    # Speicher: fest begrenzt, damit Ollama oder andere Dienste auf dem Server
    # die Datenbank nicht verdrängen können. shared_buffers (Cache der
    # Datenbank) bewusst klein gehalten: reicht für Kundendaten dieser Größe.
    mem_limit: 768m
    mem_reservation: 512m
    command: ["postgres", "-c", "shared_buffers=192MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migrationen laufen in einem eigenen, kurzen Dienst mit dem Eigentümer-Zugang
  # und beenden sich danach. Die App selbst kennt nur ihren eingeschränkten
  # Zugang (APP_DB_USER / APP_DB_PASSWORD).
  migrate:
    build:
      context: .
      args:
        APP_NAME: ${APP_NAME}
    entrypoint: ["node", "/app/packages/core/fundament/backend/src/db/migrate.js"]
    restart: "no"
    mem_limit: 256m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        APP_NAME: ${APP_NAME}
    restart: unless-stopped
    # Speicher: die App braucht im Betrieb wenig (Node + Express + Pool).
    mem_limit: 384m
    mem_reservation: 256m
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME}
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    # "default" = internes Netz zur Datenbank, "edge" = Verbindung zu Traefik.
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.${INSTALLATION}-app.rule=Host(`${DOMAIN:?In der .env fehlt DOMAIN}`)"
      - "traefik.http.routers.${INSTALLATION}-app.entrypoints=websecure"
      - "traefik.http.routers.${INSTALLATION}-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.${INSTALLATION}-app.loadbalancer.server.port=3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Alternative zu Traefik, nur mit "--profile caddy" gestartet (README).
  # Liefert keine Dateien mehr aus, sondern leitet nur weiter -- Frontend und
  # Sicherheits-Header kommen jetzt aus der App selbst.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ZIEL: ${BACKUP_ZIEL}
      BACKUP_AUFBEWAHRUNG_TAGE: ${BACKUP_AUFBEWAHRUNG_TAGE}
      BACKUP_VERSCHLUESSELUNG_SCHLUESSEL: ${BACKUP_VERSCHLUESSELUNG_SCHLUESSEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups

networks:
  # Gemeinsames Netz mit Traefik. Muss es schon geben (Traefik legt es an);
  # Server ohne Traefik: einmal "docker network create edge" (README).
  edge:
    external: true

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
